<style>
:root{--sc-primary:#0506ae;--sc-accent:#964eec;--primary:#0506ae;--accent:#964eec}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;background:#f8fafc;margin:0;padding:0;color:#0f172a;min-height:100vh}
.login-shell{min-height:100vh;background:linear-gradient(135deg,#eef2ff 0%,#f5f3ff 100%);padding:24px}

.pulse{display:inline-block;animation:pulse 1.4s ease-in-out infinite;color:#94a3b8}

#exam-root .card{border-radius:18px;border:1px solid #e2e8f0;background:white;padding:20px;margin-bottom:14px;box-shadow:0 2px 8px rgba(15,23,42,.04)}

.q-palette button.current{background:#0506ae;color:white;border-color:#0506ae}
.q-palette button.answered{background:#dcfce7;border-color:#86efac}
.q-palette button.flagged{background:#fef08a;border-color:#fde047}
.q-palette .label{font-size:.75rem;color:#64748b;width:100%;margin-bottom:4px}
.clock{font-weight:800;font-size:1.05rem;color:#0506ae}

.viol{color:#dc2626;margin-left:10px;font-size:.85rem;font-weight:700}
.option-label{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid #e2e8f0;border-radius:10px;margin:6px 0;cursor:pointer;transition:all .15s}

.option-letter{width:28px;height:28px;border-radius:50%;background:#0506ae;color:white;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;flex-shrink:0}
.option-label.selected .option-letter{background:#964eec}
.option-text{flex:1;line-height:1.5}
textarea.form-input{min-height:80px;resize:vertical}
.score-circle{width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,#0506ae,#964eec);color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 16px;font-weight:900}
.score-circle .pct{font-size:2.4rem;line-height:1}
.score-circle .lbl{font-size:.7rem;letter-spacing:.1em;opacity:.9;text-transform:uppercase}
#exam-root .actions{display:flex;justify-content:space-between;margin-top:14px;gap:8px;flex-wrap:wrap}

<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>

<script src="assets/js/cbt-engine.js"></script>
<script>
CBT.init(sb);
const Exam = {
  data:null, answers:[], idx:0, timer:null, remaining:0, monitor:null, flags:{}, startTs:0, offset:0, clientRef:null,
  qs(){ return (this.data && (this.data._questions || this.data.questions || this.data.csv_data)) || []; },
  param(){ const u=new URLSearchParams(location.search); return (u.get('code')||u.get('exam')||u.get('c')||'').toUpperCase().trim(); },
  root(){ return document.getElementById('exam-root'); },
  now(){ return Date.now() + (this.offset||0); },
  // ENTERPRISE V14 helpers (1000-candidate scale pack) ----------------------
  // One stable id per sitting: makes cbt_submit_v2 calls IDEMPOTENT — retries
  // after network drops return the original result instead of duplicating.
  newRef(){ const c=(this.data&&this.data.code)||this.param()||'EXAM'; const u=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,12)); return c+'-'+u; },
  _missingFn(err){ return /PGRST202|schema cache|Could not find the function|does not exist|404/i.test(String(err&&(err.message||err.code||err.details)||'')); },
  // v2 (scale pack) first, v1 fallback — older schemas keep working 100%.
  async _submitRpc(p){
    if(!this._noV2){
      try{ const r=await sb.rpc('cbt_submit_v2',{p_payload:p}); if(r.error && this._missingFn(r.error)) this._noV2=true; else return r; }
      catch(e){ return {error:e}; }
    }
    try{ return await sb.rpc('cbt_submit',{p_payload:p}); }catch(e){ return {error:e}; }
  },
  async start(){
    const code=this.param();
    if(code){ this.codeEntry(code); } else { this.codeEntry(''); }
  },
  codeEntry(prefill){
    this.root().innerHTML = '<div class="card"><h3>Enter exam details</h3>'+
      '<div class="form-group"><label>Exam code</label><input class="form-input" id="e-code" value="'+(prefill||'')+'" placeholder="ABC123"></div>'+
      '<div class="form-group"><label>Your full name <span style="color:var(--gray-500);font-weight:400">(optional for anonymous exams)</span></label><input class="form-input" id="e-name" placeholder="Surname First-name"></div>'+
      '<div class="form-group"><label>Your student ID / admission no (if registered)</label><input class="form-input" id="e-id" placeholder="optional for open exams"></div>'+
      '<div class="form-group"><label>Class</label><input class="form-input" id="e-class" placeholder="e.g. JSS1"></div>'+
      '<div style="display:flex;gap:10px;flex-wrap:wrap">'+
        '<button class="btn btn-primary" onclick="Exam.load(false)">Start exam</button>'+
        '<button class="btn btn-outline" onclick="Exam.load(true)">👤 Continue as Guest (anonymous)</button>'+
      '</div>'+
      '<p style="color:var(--gray-500);font-size:.82rem;margin-top:10px">No account needed for open exams. Guests can take the exam anonymously.</p></div>';
  },
  async load(anon){
    if(!sb){ toast('Database not configured.','warning'); return; }
    const code=document.getElementById('e-code').value.toUpperCase().trim();
    let nm=document.getElementById('e-name').value.trim();
    if(anon && !nm) nm='Anonymous-'+Math.random().toString(36).slice(2,7).toUpperCase();
    this.student={ name:nm, id_ref:document.getElementById('e-id').value.trim(), class:document.getElementById('e-class').value.trim(), anonymous:!!anon };
    if(!code){ toast('Enter the exam code.','warning'); return; }
    if(!this.student.name){ this.student.name='Anonymous-'+Math.random().toString(36).slice(2,7).toUpperCase(); }
    // ENTERPRISE V9 (issue 8: 400+ concurrent candidates): exam-load retries
    // with exponential backoff + jitter absorb the thundering herd.
    // ENTERPRISE V14 (issue 44: 1000 SIMULTANEOUS candidates):
    // 1) a 300–1800 ms START JITTER spreads the "whole hall presses Start at
    //    once" burst across two seconds — no single-second spike;
    // 2) cbt_get_public_exam_v2 preferred (server clock, exam window, integrity
    //    config, attempt limits) with automatic v1 fallback on older schemas;
    // 3) the 10-minute local exam cache means refreshes/re-entries NEVER
    //    re-hit the database — each candidate costs exactly ONE indexed read.
    let data=null, error=null;
    const cacheKey='cbt-exam-cache-'+code;
    try{ const c=JSON.parse(localStorage.getItem(cacheKey)||'null'); if(c && (Date.now()-c.at)<600000){ data=c.exam; } }catch(_){}
    if(!data){
      await new Promise(r=>setTimeout(r, 300+Math.floor(Math.random()*1500))); // start jitter
      for(let attempt=0;attempt<5;attempt++){
        let r=null;
        if(!this._noV2){
          try{ r=await sb.rpc('cbt_get_public_exam_v2', { p_code: code }); if(r.error && this._missingFn(r.error)) this._noV2=true; }
          catch(e){ r={error:e}; }
        }
        if(this._noV2){ try{ r=await sb.rpc('cbt_get_public_exam', { p_code: code }); }catch(e){ r={error:e}; } }
        data=r? r.data:null; error=r? r.error:{message:'Network error'};
        if(data && !error) break;
        const wait=Math.min(6000,(400*Math.pow(2,attempt)))+Math.floor(Math.random()*500);
        toast('Busy server — retrying ('+(attempt+1)+'/5)…','info',1500);
        await new Promise(r=>setTimeout(r,wait));
      }
      if(data && !error && !data.wait && !data.closed){ try{ localStorage.setItem(cacheKey, JSON.stringify({at:Date.now(), exam:data})); }catch(_){} }
    }
    if(error || !data){ toast('Exam not found or not open.','danger'); return; }
    if(data.wait){ this.root().innerHTML='<div class="card"><h3>⏳ Please wait</h3><p>This exam opens at '+(window.fmtDMYT?fmtDMYT(data.start_at):new Date(data.start_at).toLocaleString())+'.</p></div>'; return; }
    if(data.closed){ this.root().innerHTML='<div class="card"><h3>🚫 Closed</h3><p>This exam is no longer accepting submissions.</p></div>'; return; }
    this.data=data; CBT.prepareForStudent(this.data); if(!this.qs().length){ this.root().innerHTML='<div class="card"><h3>No questions found</h3><p>This CBT exam has no valid questions. Ask the teacher to re-upload the CSV question bank.</p></div>'; return; }
    try { const sections = [...new Set(this.qs().map(q => (q.section || q.subject || 'General')).filter(Boolean))]; if (String(this.data.subject || '').toLowerCase().startsWith('multi-subject') && sections.length <= 1) { console.warn('[CBT] Multi-subject exam loaded without distinct subject tabs. Check subject_breakdown and per-question subject metadata.'); } } catch(_) {}
    try { const sections = [...new Set(this.qs().map(q => (q.section || q.subject || 'General')).filter(Boolean))]; if (String(this.data.subject || '').toLowerCase().startsWith('multi-subject') && sections.length <= 1) { console.warn('[CBT] Multi-subject exam loaded without distinct subject tabs. Check subject_breakdown and per-question subject metadata.'); } } catch(_) {}
    this.answers=new Array(this.qs().length).fill(null);
    // ENTERPRISE V14: SERVER CLOCK. v2 returns server_now, so the countdown
    // follows the SERVER, not a wrong device clock; on v1/legacy schemas the
    // offset is simply 0 (previous behaviour, unchanged).
    this.offset = data.server_now ? (Date.parse(data.server_now) - Date.now()) : 0;
    if(!isFinite(this.offset)) this.offset=0;
    this.remaining=(data.duration||45)*60; this.startTs=this.now(); this.deadline = this.startTs + (this.remaining * 1000);
    // Clamp the deadline to the exam window (close_at + the server's own 120s grace).
    if(data.close_at){ const cap=Date.parse(data.close_at)+120000; if(isFinite(cap) && cap<this.deadline) this.deadline=cap; }
    if(this.deadline<=this.now()){ this.root().innerHTML='<div class="card"><h3>🚫 Time over</h3><p>The time window for this exam has elapsed.</p></div>'; return; }
    // ENTERPRISE V14: crash / refresh / power-cut RESUME. Answers are keyed
    // by each question's _orig_index, so they survive question shuffling;
    // the ORIGINAL attempt ref + deadline are restored — no work is lost and
    // restarting the browser never buys extra time or a duplicate result.
    this.clientRef=this.newRef();
    try{
      const draft=JSON.parse(localStorage.getItem('cbt-draft-'+this.data.code)||'null');
      if(draft && Array.isArray(draft.a) && draft.a.length===this.qs().length && draft.a.some(x=>x && x.v!=null) && draft.d && Date.now()<draft.d){
        if(confirm('An unfinished attempt at this exam was found on this device.\n\nResume where you stopped? Your answers and remaining time are kept.')){
          const map={}; draft.a.forEach(x=>{ if(x) map[x.o]=x.v; });
          this.answers=this.qs().map((q,i)=>{ const k=(q._orig_index!=null?q._orig_index:i); return (map[k]!=null?map[k]:null); });
          const pos=this.qs().findIndex((q,i)=>((q._orig_index!=null?q._orig_index:i)===draft.io));
          this.idx=pos>=0?pos:0;
          this.clientRef=draft.ref||this.clientRef; if(draft.s) this.startTs=draft.s;
          this.deadline=Math.min(draft.d,this.deadline); // never extend the clock
        } else { try{ localStorage.removeItem('cbt-draft-'+this.data.code); }catch(__){} }
      }
    }catch(_){ }
    if(data.instructions){ if(!confirm('Instructions:\n\n'+data.instructions+'\n\nClick OK to begin.')) { this.codeEntry(code); return; } }
    this.beginMonitor(); this.tick(); this.render();
  },
  beginMonitor(){
    let viol=0; const cfg=this.data.anti_cheat_config||{};
    this.monitor=CBT.startAntiCheat(cfg,(type,n)=>{ viol=n; this.violations=n; this.violationLog=this.monitor.log; const w=document.getElementById('viol'); if(w) w.textContent='⚠ '+n+' integrity flag(s)'; if((cfg.max_violations||5) && n>=cfg.max_violations){ toast('Too many integrity violations — submitting.','danger'); this.submit(); } });
  },
  tick(){ if(this.timer) clearInterval(this.timer); const update=()=>{ this.remaining=Math.max(0, Math.ceil((this.deadline-this.now())/1000)); const t=document.getElementById('clock'); if(t){ const m=Math.floor(this.remaining/60),ss=this.remaining%60; t.textContent=m+':'+String(ss).padStart(2,'0'); if(this.remaining<=60)t.style.color='#dc2626'; } if(this.remaining<=0){ clearInterval(this.timer); this.timer=null; toast('Time up — submitting.','warning'); this.submit(); } }; update(); this.timer=setInterval(update,1000); },
  render(){
    const q=this.qs()[this.idx]; if(!q){ return; }
    const opts=(q.options||[]).map((o,i)=>{ const L=String.fromCharCode(65+i); const checked=this.answers[this.idx]===L?'checked':''; return '<label style="display:block;padding:10px;border:1px solid var(--gray-200);border-radius:8px;margin:6px 0;cursor:pointer"><input type="radio" name="opt" value="'+L+'" '+checked+' onchange="Exam.answer(\''+L+'\')"> '+L+'. '+esc(o)+'</label>'; }).join('');
    const free=(['short','numeric','essay','code','cloze','multinumeric'].includes(q.type))?'<textarea class="form-input" rows="3" oninput="Exam.answer(this.value)" placeholder="Type your answer">'+esc(this.answers[this.idx]||'')+'</textarea>':'';
    this.root().innerHTML='<div class="card">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><strong>Q '+(this.idx+1)+' / '+this.qs().length+'</strong>'+
      '<div>⏱ <span id="clock">'+Math.floor(this.remaining/60)+':'+String(this.remaining%60).padStart(2,'0')+'</span> <span id="viol" style="color:#dc2626;margin-left:10px"></span></div></div>'+
      '<p style="font-size:1.05rem;margin-bottom:10px">'+esc(q.question)+'</p>'+ opts + free +
      '<div style="display:flex;justify-content:space-between;margin-top:14px;gap:8px;flex-wrap:wrap">'+
        '<button class="btn btn-outline" onclick="Exam.prev()" '+(this.idx===0?'disabled':'')+'>← Prev</button>'+
        '<button class="btn btn-outline" onclick="Exam.flag()">🚩 Flag</button>'+
        (this.idx<this.qs().length-1?'<button class="btn btn-primary" onclick="Exam.next()">Next →</button>':'<button class="btn btn-primary" onclick="Exam.confirmSubmit()">Submit ✓</button>')+
      '</div>'+
      '<div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:6px">'+this.qs().map((_,i)=>'<button onclick="Exam.go('+i+')" style="width:34px;height:34px;border-radius:6px;border:1px solid var(--gray-300);background:'+(i===this.idx?'var(--primary);color:#fff':(this.answers[i]!=null?'#dcfce7':(this.flags[i]?'#fef08a':'#fff')))+'">'+(i+1)+'</button>').join('')+'</div>'+
    '</div>';
  },
  answer(v){ this.answers[this.idx]=v; this.saveDraft(); },
  // Answers are keyed by _orig_index (not screen position) so a resume stays
  // correct even when question shuffling produces a different order (V14).
  saveDraft(){ try{ const arr=this.qs().map((q,i)=>({o:(q._orig_index!=null?q._orig_index:i),v:this.answers[i]})); const cur=this.qs()[this.idx]||{}; localStorage.setItem('cbt-draft-'+this.data.code, JSON.stringify({a:arr,io:(cur._orig_index!=null?cur._orig_index:this.idx),at:Date.now(),ref:this.clientRef,d:this.deadline||0,s:this.startTs||0})); }catch(e){} },
  flag(){ this.flags[this.idx]=!this.flags[this.idx]; this.render(); },
  go(i){ this.idx=i; this.render(); }, next(){ if(this.idx<this.qs().length-1){this.idx++;this.render();} }, prev(){ if(this.idx>0){this.idx--;this.render();} },
  confirmSubmit(){ const un=this.answers.filter(a=>a==null).length; if(un && !confirm(un+' question(s) unanswered. Submit anyway?'))return; this.submit(); },
  async submit(){
    if(this._done)return; this._done=true; clearInterval(this.timer); if(this.monitor)this.monitor.stop();
    const graded=CBT.gradeSubmission(this.data,this.answers);
    const timeTaken=Math.round((Date.now()-this.startTs)/1000);
    const payload={ exam_id:this.data.id, student_name:this.student.name, student_class:this.student.class, student_id_ref:this.student.id_ref, student_type:this.data.exam_mode,
      client_ref:this.clientRef||null,
      score:graded.score, total:graded.total, percent:graded.percent, correct_count:graded.correct, wrong_count:graded.wrong, skipped_count:graded.skipped,
      time_taken:timeTaken, violations:this.violations||0, violation_log:this.violationLog||[],
      answers_data:this.qs().map((q,i)=>({ index:(q._orig_index!=null?q._orig_index:i), subject:(q.section||q.subject||'General'), answer:this.answers[i] })) };
    // ENTERPRISE V6 (issue 41): high-concurrency submission hardening.
    // 50+ students submitting at once can hit transient network/database
    // contention; retry up to 4 times with exponential backoff + jitter
    // before falling back to the local backup file.
    // ENTERPRISE V8 (issue 12): tuned for 100+ simultaneous candidates —
    // 6 retries, exponential backoff capped at 8s with jitter, plus an
    // auto-resubmit queue (pending submissions retry on next page load).
    let resp=null;
    // ENTERPRISE V14: tiny submit jitter — when the timer ends for a whole
    // hall at once, 1000 submissions spread across ~1.2 s instead of one
    // same-second spike. cbt_submit_v2 is tried first (idempotent client_ref,
    // attempt limits, closed-window guard); v1 schemas fall back seamlessly.
    await new Promise(r=>setTimeout(r, Math.floor(Math.random()*1200)));
    for(let attempt=0;attempt<6;attempt++){
      resp=await this._submitRpc(payload);
      if(resp && !resp.error && resp.data && resp.data.saved) break;
      // Definitive server refusals (attempt limit / exam closed) must NOT be retried.
      const srv=resp && resp.data && (resp.data.error||'');
      if(srv==='attempts_exhausted' || srv==='closed') break;
      const wait=Math.min(8000,(500*Math.pow(2,attempt)))+Math.floor(Math.random()*600);
      this.root().insertAdjacentHTML('beforeend','<p style="text-align:center;color:var(--gray-500)">Submitting… retry '+(attempt+1)+' of 6</p>');
      await new Promise(r=>setTimeout(r,wait));
    }
    if(!resp || resp.error || !resp.data || !resp.data.saved){
      const serverMsg = resp && resp.data && (resp.data.message || resp.data.error);
      if(serverMsg && /attempt|closed/i.test(String(serverMsg))){
        // Clean server-side refusal: show it, keep no queue, no backup confusion.
        try{ localStorage.removeItem('cbt-draft-'+this.data.code); }catch(e){}
        this.root().innerHTML='<div class="card" style="text-align:center"><h3>⚠️ '+esc(serverMsg)+'</h3><p>If you believe this is a mistake, please contact your invigilator.</p></div>';
        return;
      }
      try{ const q=JSON.parse(localStorage.getItem('cbt-pending-queue')||'[]'); q.push(payload); localStorage.setItem('cbt-pending-queue',JSON.stringify(q.slice(-10))); }catch(_){}
    } else {
      try{ localStorage.removeItem('cbt-pending-queue'); }catch(_){}
    }
    try{ localStorage.removeItem('cbt-draft-'+this.data.code); }catch(e){}
    if(!resp || resp.error || !resp.data || !resp.data.saved){
      // Emergency backup
      const blob=new Blob([JSON.stringify({payload,graded},null,2)],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      this.root().innerHTML='<div class="card"><h3>⚠️ Could not save online</h3><p>Please download your result and send it to your teacher.</p><a class="btn btn-primary" href="'+url+'" download="exam-backup.json">Download backup</a></div>';
      return;
    }
    const d=resp.data;
    if(d.release_results===false){
      this.root().innerHTML='<div class="card" style="text-align:center"><h2>✅ Submission Received</h2><p>Your answers were recorded. Results will be released by your teacher.</p></div>';
    } else {
      this.root().innerHTML='<div class="card" style="text-align:center"><h2>🎉 Score: '+(d.score ?? graded.score)+' / '+(d.total ?? graded.total)+' ('+(d.percent ?? graded.percent)+'%)</h2>'+
        '<p>Grade: <strong>'+graded.grade+'</strong> · Correct: '+(d.correct_count ?? graded.correct)+' · Wrong: '+(d.wrong_count ?? graded.wrong)+' · Skipped: '+(d.skipped_count ?? graded.skipped)+'</p>'+
        (d.cert_code?'<p>Certificate code: <strong>'+esc(d.cert_code)+'</strong></p>':'')+
        (d.report_column?'<p style="color:var(--gray-500)">This result was added to the <strong>'+esc(d.report_column)+'</strong> column of the report card.</p>':'')+
      '</div>';
    }
  }
};
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(m,t){ alert(m); }
function openModal(){} function closeModal(){}
// ENTERPRISE V13 / V5: robust UTME-style multi-subject experience.
// This replaces the fragile post-render injection with a full subject-aware
// renderer, so subject tabs ALWAYS appear when questions contain section/subject.
(function(){
 if(!window.Exam) return;
 Exam.subjectOf=function(q){
  if (q && (q.section || q.subject || q.subject_section || q.exam_subject)) return (q.section || q.subject || q.subject_section || q.exam_subject);
  const bd = (((this.data||{}).anti_cheat_config||{}).subject_breakdown)||[];
  const oi = Number(q && q._orig_index != null ? q._orig_index : -1);
  if (oi >= 0) {
    for (const b of bd) {
      const start = Number(b.start)||0; const end = b.end != null ? Number(b.end) : (start + (Number(b.count)||0) - 1);
      if (oi >= start && oi <= end) return b.name || 'General';
    }
  }
  return 'General';
 };
 Exam.sections=function(){
  const seen=[]; const bd=((((this.data||{}).anti_cheat_config||{}).subject_breakdown)||[]);
  if (bd.length>1) bd.forEach(b=>{ const n=b && b.name ? String(b.name) : ''; if(n && !seen.includes(n)) seen.push(n); });
  this.qs().forEach(q=>{ const s=this.subjectOf(q); if(!seen.includes(s)) seen.push(s); });
  return seen;
 };
 Exam.currentSubject=function(){ const q=this.qs()[this.idx]; return this.subjectOf(q); };
 Exam.indexesForSubject=function(sec){ const out=[]; this.qs().forEach((q,i)=>{ if(this.subjectOf(q)===sec) out.push(i); }); return out; };
 Exam.goSubject=function(sec){ const i=this.qs().findIndex(q=>this.subjectOf(q)===sec); if(i>=0){this.idx=i;this.render();} };
 Exam.sectionStats=function(sec){ let t=0,a=0; this.qs().forEach((q,i)=>{ if(this.subjectOf(q)===sec){ t++; if(this.answers[i]!=null&&String(this.answers[i]).trim()!=='')a++; } }); return {t,a}; };
 Exam.nextInSubject=function(){ const list=this.indexesForSubject(this.currentSubject()); const p=list.indexOf(this.idx); if(p>=0 && p<list.length-1){ this.idx=list[p+1]; this.render(); } };
 Exam.prevInSubject=function(){ const list=this.indexesForSubject(this.currentSubject()); const p=list.indexOf(this.idx); if(p>0){ this.idx=list[p-1]; this.render(); } };
 Exam.renderTabs=function(current){ const secs=this.sections(); if(secs.length<=1) return ''; return '<div class="cbt-subject-tabs" style="position:sticky;top:0;z-index:20;background:white;display:flex;gap:8px;flex-wrap:wrap;margin:-4px -4px 14px;padding:10px 4px;border-bottom:2px solid var(--gray-200)">'+secs.map(sec=>{ const st=this.sectionStats(sec), key=encodeURIComponent(sec); return '<button type="button" class="btn btn-sm '+(sec===current?'btn-primary':'btn-outline')+'" onclick="Exam.goSubject(decodeURIComponent(\''+key+'\'))" style="font-weight:800">'+esc(sec)+' <span style="font-size:.68rem;opacity:.85">('+st.a+'/'+st.t+')</span></button>'; }).join('')+'</div>'; };
 Exam.renderPalette=function(current){ let localNo=0; return '<div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:6px"><div style="font-size:.75rem;color:var(--gray-500);width:100%;margin-bottom:4px">'+esc(current)+' — question map</div>'+this.qs().map((qq,i)=>{ if(this.subjectOf(qq)!==current) return ''; localNo++; const bg=i===this.idx?'var(--primary);color:#fff':(this.answers[i]!=null?'#dcfce7':(this.flags[i]?'#fef08a':'#fff')); return '<button type="button" onclick="Exam.go('+i+')" title="'+esc(current)+' question '+localNo+'" style="width:34px;height:34px;border-radius:6px;border:1px solid var(--gray-300);background:'+bg+'">'+localNo+'</button>'; }).join('')+'</div>'; };
 Exam.render=function(){
  const q=this.qs()[this.idx]; if(!q) return;
  const current=this.currentSubject(); const subjectIndexes=this.indexesForSubject(current); const localPos=subjectIndexes.indexOf(this.idx); const localNo=localPos+1;
  const hasOptions=(q.options||[]).length>0 && !['short_answer','short','numeric','essay','code','cloze','multinumeric','fill_blank','math_equation'].includes(q.type);
  const opts=hasOptions?(q.options||[]).map((o,i)=>{ const L=String.fromCharCode(65+i); const checked=this.answers[this.idx]===L?'checked':''; return '<label style="display:block;padding:10px;border:1px solid var(--gray-200);border-radius:8px;margin:6px 0;cursor:pointer"><input type="radio" name="opt" value="'+L+'" '+checked+' onchange="Exam.answer(\''+L+'\')"> '+L+'. '+esc(o)+'</label>'; }).join(''):'';
  const free=!hasOptions?'<textarea class="form-input" rows="3" oninput="Exam.answer(this.value)" placeholder="Type your answer">'+esc(this.answers[this.idx]||'')+'</textarea>':'';
  this.root().innerHTML='<div class="card">'+this.renderTabs(current)+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap"><strong>'+esc(current)+' · Q '+localNo+' / '+subjectIndexes.length+' <span style="color:var(--gray-500);font-weight:600">(overall '+(this.idx+1)+' / '+this.qs().length+')</span></strong>'+
    '<div>⏱ <span id="clock">'+Math.floor(this.remaining/60)+':'+String(this.remaining%60).padStart(2,'0')+'</span> <span id="viol" style="color:#dc2626;margin-left:10px"></span></div></div>'+
    '<p style="font-size:1.05rem;margin-bottom:10px">'+esc(q.question)+'</p>'+ opts + free +
    '<div style="display:flex;justify-content:space-between;margin-top:14px;gap:8px;flex-wrap:wrap">'+
      '<button class="btn btn-outline" onclick="Exam.prevInSubject()" '+(localPos<=0?'disabled':'')+'>← Prev in '+esc(current)+'</button>'+
      '<button class="btn btn-outline" onclick="Exam.flag()">🚩 Flag</button>'+
      (localPos<subjectIndexes.length-1?'<button class="btn btn-primary" onclick="Exam.nextInSubject()">Next in '+esc(current)+' →</button>':'<button class="btn btn-outline" disabled>End of '+esc(current)+'</button>')+
      '<button class="btn btn-primary" onclick="Exam.confirmSubmit()">Submit Exam ✓</button>'+
    '</div>'+this.renderPalette(current)+'</div>';
 };
})();

// ENTERPRISE V8: flush any queued (failed) submissions from a previous session.
// ENTERPRISE V14: flushes go through the v2 idempotent endpoint first (a queued
// payload carries its original client_ref, so a flush after a successful first
// delivery returns the same result instead of duplicating); v1 fallback kept.
async function cbtSubmitAny(p){
  try{ const r=await sb.rpc('cbt_submit_v2',{p_payload:p}); if(r.error && Exam._missingFn(r.error)) return await sb.rpc('cbt_submit',{p_payload:p}); return r; }
  catch(e){ try{ return await sb.rpc('cbt_submit',{p_payload:p}); }catch(e2){ return {error:e2}; } }
}
(async function(){
  try{
    const q=JSON.parse(localStorage.getItem('cbt-pending-queue')||'[]');
    if(q.length && window.sb){
      const rest=[];
      for(const p of q){ try{ const r=await cbtSubmitAny(p); if(!(r&&r.data&&r.data.saved)) rest.push(p); }catch(_){ rest.push(p); } }
      localStorage.setItem('cbt-pending-queue',JSON.stringify(rest));
      if(q.length!==rest.length) toast((q.length-rest.length)+' queued submission(s) delivered.','success');
    }
  }catch(_){}
})();
Exam.start();
</script>
